[package]
name = "phantom-app"
version = "0.1.2"
description = "Phantom Terminal native app: winit window + egui UI over the VT core and phantom-gfx renderer"
authors = ["Steve Pryde"]
license = "MIT"
edition = "2021"

[[bin]]
name = "phantom"
path = "src/main.rs"

# Native shell: winit window + PTY wiring, drawing the VT snapshot through the
# hand-rolled phantom-gfx renderer.
[dependencies]
arboard = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
phantom-core = { workspace = true }
phantom-emu = { workspace = true }
phantom-gfx = { workspace = true }
pollster = { workspace = true }
serde_json = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
