[package]
name = "phantom-gfx"
version = "0.1.2"
description = "Phantom Terminal GPU grid renderer: glyph atlas + instanced wgpu pipelines"
authors = ["Steve Pryde"]
license = "MIT"
edition = "2021"

[lints]
workspace = true

# Hand-rolled wgpu terminal renderer. Rasterizes the configured font with swash
# (faces discovered via fontique) into a glyph atlas, then draws the grid with two
# instanced pipelines: solid quads (backgrounds, cursor, underline/strike) and
# textured glyph quads (alpha-mask tinted by fg, plus colour-emoji passthrough).
[dependencies]
wgpu = { workspace = true }
swash = { workspace = true }
fontique = { workspace = true }
bytemuck = { workspace = true }
image = { workspace = true }
phantom-core = { workspace = true }
phantom-emu = { workspace = true }
unicode-width = { workspace = true }
# Only used by the optional headless offscreen-render harness; not in the app.
pollster = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the locked egui tree. Provides a known-good terminal face when a
# minimal Linux install has no usable system monospace font.
epaint_default_fonts = { workspace = true }

[features]
# Offscreen render-to-image harness (`phantom_gfx::headless`) for pixel tests and
# snapshot dumps. Off by default so the shipped app build never pulls pollster.
headless = ["dep:pollster"]

[dev-dependencies]
# PNG encoding for the `snapshot` example's image dump.
png = { workspace = true }
epaint_default_fonts = { workspace = true }

[[example]]
name = "snapshot"
required-features = ["headless"]
