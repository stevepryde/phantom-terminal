[package]
name = "phantom-core"
version = "0.1.2"
description = "Phantom Terminal core: PTY lifecycle, config, session store, launch parsing"
authors = ["Steve Pryde"]
license = "MIT"
edition = "2021"

# UI-agnostic backend for the native winit/wgpu app. No GUI or rendering
# dependencies belong here.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
portable-pty = { workspace = true }
rusqlite = { workspace = true }
directories = { workspace = true }
thiserror = { workspace = true }
noyalib = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
