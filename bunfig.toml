[install]
# Refuse any package version published less than 7 days ago. A freshly
# published malicious version (the TanStack-style supply-chain attack) is most
# dangerous in its first hours before it is caught and yanked; this cooldown
# means we never install into that window.
minimumReleaseAge = 604800

# Bun blocks dependency lifecycle scripts unless a package is listed here.
# Keep this empty unless a package has been explicitly reviewed.
trustedDependencies = []
