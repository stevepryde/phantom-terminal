# osv-scanner advisory policy — mirrors the cargo-deny ignore list in deny.toml.
#
# The list is empty: the native Rust workspace (phantom-core / phantom-emu /
# phantom-gfx / phantom-app) has no outstanding advisories. The previous entries
# all covered unmaintained/unsound transitive Tauri deps (GTK3 / gtk-rs / unic /
# proc-macro-error), which are gone with the Tauri build.
#
# Add an [[IgnoredVulns]] entry ONLY for an informational (unmaintained/unsound)
# advisory with a written reason — never to silence a real vulnerability. Keep in
# sync with deny.toml.
#
# Use locally with: osv-scanner scan source --config=osv-scanner.toml .
