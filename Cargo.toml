[workspace]
members = ["crates/phantom-core", "crates/phantom-emu", "crates/phantom-gfx", "crates/phantom-app"]
resolver = "2"

# Shared dependency versions for every workspace member. Members opt in with
# `dep.workspace = true`, so a version bump happens in exactly one place.
[workspace.dependencies]
alacritty_terminal = "=0.26.0"
arboard = "3"
bytemuck = { version = "1", features = ["derive"] }
directories = "6"
egui = "0.34.3"
egui-wgpu = "0.34.3"
egui-winit = { version = "0.34.3", default-features = false }
epaint_default_fonts = "=0.34.3"
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }
image = { version = "0.25.10", default-features = false, features = ["webp"] }
libc = "0.2"
noyalib = { version = "0.0.15", default-features = false, features = ["minimal"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSResponder", "NSView", "NSWindow"] }
phantom-core = { version = "0.1.2", path = "crates/phantom-core" }
phantom-emu = { version = "0.1.2", path = "crates/phantom-emu" }
phantom-gfx = { version = "0.1.2", path = "crates/phantom-gfx" }
png = "0.17"
pollster = "0.4.0"
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swash = "0.2"
thiserror = "2"
# Already in the tree via alacritty_terminal; same version, no new supply chain.
unicode-width = "0.2"
wgpu = "29"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }

[patch.crates-io]
# wayland-scanner 0.31.10 on crates.io still pins vulnerable quick-xml 0.39.
# This local copy ports upstream's quick-xml 0.41 dependency and parser
# compatibility changes; see vendor/wayland-scanner/PHANTOM_PATCH.md.
# Remove it when the next crates.io wayland-scanner release includes them.
wayland-scanner = { path = "vendor/wayland-scanner" }
