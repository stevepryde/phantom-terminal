[package]
name = "phantom-terminal"
version = "0.1.2"
description = "A terminal that remembers your tabs and sessions"
authors = ["Steve Pryde"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "phantom_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Thin Tauri shell over the UI-agnostic core. All terminal/config/session logic
# lives in `phantom-core`; this crate only adapts it to the webview IPC surface.
tauri = { version = "2", features = ["macos-private-api"] }
# Version pin (not just a path) so cargo-deny's wildcard ban is satisfied.
phantom-core = { version = "0.1.2", path = "../crates/phantom-core" }

[dev-dependencies]
# Used only to construct a `rusqlite::Error` in the command_error mapping tests.
rusqlite = { workspace = true }
