# cargo-deny configuration — supply-chain policy for the whole Rust workspace
# (phantom-core / phantom-emu / phantom-gfx / phantom-app, plus the Tauri build
# that still ships during the native pivot). Run from the workspace root:
#   cargo deny check

[advisories]
version = 2
# Fail on any crate with a known security advisory or a yanked release.
yanked = "deny"
# The entries below are *unmaintained* / *unsound* informational advisories only
# (not exploitable vulnerabilities), and every one is a transitive dependency
# pulled in by Tauri itself — none is in our direct dependency tree and none has a
# safe upgrade available while we track Tauri 2 (GTK3 / gtk-rs 0.18). We list each
# ID explicitly (rather than disabling the unmaintained/unsound check wholesale)
# so that an unmaintained crate we DO control would still fail CI. Actual security
# vulnerabilities remain hard-denied. Revisit when Tauri migrates off GTK3 / unic.
#
# Keep this list in sync with ../osv-scanner.toml, which gates the same advisories.
ignore = [
  # gtk-rs GTK3 bindings — Tauri's Linux webview backend (wry → webkit2gtk).
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  # glib 0.18.5 — unsoundness in glib::VariantStrIter (fixed in 0.20.0, which
  # requires gtk-rs 0.20 / a newer Tauri). Pinned transitively by gtk 0.18. Our
  # code never calls VariantStrIter; it lives in the GTK binding layer.
  "RUSTSEC-2024-0429",
  # unic-* family — via tauri-utils → urlpattern → unic-ucd-*.
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
  # proc-macro-error — build-time macro dependency in the Tauri toolchain.
  "RUSTSEC-2024-0370",
]

[bans]
# Flag duplicate versions (bloat / unexpected forks) but don't hard-fail v1.
multiple-versions = "warn"
# Wildcard ("*") version requirements are forbidden — they undermine the lockfile.
wildcards = "deny"
# Networking clients we never want to add ourselves. (Tauri pulls reqwest/hyper
# internally for its core; that is covered by the capability lockdown + CSP and
# by scripts/check-no-network.sh, not banned here.)
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  # egui's bundled UI fonts (epaint_default_fonts). Keep these explicit so
  # adding non-font crates under these licenses still shows up in dependency
  # review.
  "OFL-1.1",
  "Ubuntu-font-1.0",
  # Boost Software License — clipboard-win / error-code (arboard's Windows
  # clipboard backend; permissive, OSI-approved). Windows-only at runtime, but
  # present in the all-platform lockfile.
  "BSL-1.0",
]

[sources]
# Only the official crates.io registry is allowed — no arbitrary git/registry sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
