# cargo-deny configuration — supply-chain policy for the Rust workspace
# (phantom-core / phantom-emu / phantom-gfx / phantom-app). Run from the
# workspace root:
#   cargo deny check

[advisories]
version = 2
# Fail on any crate with a known security advisory or a yanked release.
yanked = "deny"
# No advisory exceptions. The old ignore list existed solely for unmaintained /
# unsound transitive Tauri deps (GTK3 / gtk-rs / unic / proc-macro-error); those
# are gone with the Tauri build. Add an entry here ONLY for an informational
# (unmaintained/unsound) advisory with a written justification — never to silence
# a real vulnerability. Keep in sync with ../osv-scanner.toml.
ignore = []

[bans]
# Flag duplicate versions (bloat / unexpected forks) but don't hard-fail v1.
multiple-versions = "warn"
# Wildcard ("*") version requirements are forbidden — they undermine the lockfile.
wildcards = "deny"
# Networking clients we never want to add ourselves.
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  # egui's bundled UI fonts (epaint_default_fonts). Keep these explicit so
  # adding non-font crates under these licenses still shows up in dependency
  # review.
  "OFL-1.1",
  "Ubuntu-font-1.0",
  # Boost Software License — clipboard-win / error-code (arboard's Windows
  # clipboard backend; permissive, OSI-approved). Windows-only at runtime, but
  # present in the all-platform lockfile.
  "BSL-1.0",
]

[sources]
# Only the official crates.io registry is allowed — no arbitrary git/registry sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
