name: CI

# Security-first CI for Phantom Terminal (native Rust app).
#
# All third-party actions are pinned to a full commit SHA (not a mutable tag),
# because the CI pipeline is itself a supply-chain surface. The trailing comment
# records the human-readable version the SHA corresponds to. Bump deliberately.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Static analysis: formatting + linting ───────────────────────────────────
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # winit needs the X11/Wayland/xkbcommon client headers to compile on Linux.
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

  # ── Workflow security: lint the CI itself ───────────────────────────────────
  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # actionlint is not packaged by install-action, so fetch the pinned
      # release binary directly and verify its SHA-256 before trusting it.
      # Bump both the version and the checksum together (deliberately).
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "$url" -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          rm -f actionlint.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: taiki-e/install-action@15413b256f995d819248ea62704771a959284285 # v2.79.13
        with:
          tool: zizmor

      - name: actionlint
        run: actionlint -color

      # zizmor audits workflows for injection, excessive permissions, unpinned
      # actions, etc. — the CI pipeline is itself a supply-chain surface.
      - name: zizmor
        run: zizmor .github/workflows

  # ── Supply-chain & data-protection gates ────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: osv-scanner (Rust lockfile)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          # The advisory ignore policy lives in osv-scanner.toml (mirroring
          # deny.toml); it is currently empty. The workspace-root Cargo.lock
          # covers every crate (phantom-core/emu/gfx/app).
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=Cargo.lock

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@15413b256f995d819248ea62704771a959284285 # v2.79.13
        with:
          tool: cargo-audit,cargo-deny

      # cargo-audit is the vulnerability gate (fails on any RustSec *vulnerability*).
      # It does not read deny.toml; the comprehensive advisory policy (advisories +
      # licenses + sources + bans) is enforced by the cargo-deny step below.
      - name: cargo audit (RustSec vulnerabilities)
        run: cargo audit

      - name: cargo deny (advisories + licenses + sources + bans)
        run: cargo deny check

      # Asserts the "no outbound network" posture: no workspace crate adds an
      # HTTP-client / websocket dependency.
      - name: No-network posture check
        run: bash scripts/check-no-network.sh

  # ── Build + test matrix (the platforms we ship) ─────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build (locked)
        run: cargo build --workspace --locked --verbose

      - name: Test (locked)
        run: cargo test --workspace --locked --verbose

  # ── SBOM for auditability ───────────────────────────────────────────────────
  sbom:
    name: SBOM (CycloneDX)
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@15413b256f995d819248ea62704771a959284285 # v2.79.13
        with:
          tool: cargo-cyclonedx

      # Generate the SBOM for the app crate; its dependency tree transitively
      # covers phantom-core/emu/gfx. --override-filename is a bare basename, so it
      # lands next to the manifest at crates/phantom-app/sbom-rust.json.
      - name: Rust SBOM
        run: cargo cyclonedx --format json --override-filename sbom-rust --manifest-path crates/phantom-app/Cargo.toml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: crates/phantom-app/sbom-rust.json
          if-no-files-found: warn
