name: CI

# Security-first CI for Phantom Terminal.
#
# All third-party actions are pinned to a full commit SHA (not a mutable tag),
# because the CI pipeline is itself a supply-chain surface. The trailing comment
# records the human-readable version the SHA corresponds to. Bump deliberately.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Static analysis: formatting, linting, types (JS + Rust) ──────────────────
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # clippy compiles the Tauri lib, which needs the webview/build deps.
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl wget file libssl-dev libxdo-dev

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.9"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install JS deps (frozen, no scripts)
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc)
        run: bun run typecheck

      - name: Lint (Biome)
        run: bun run lint

      - name: Frontend unit tests
        run: bun run test

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

  # ── Workflow security: lint the CI itself ───────────────────────────────────
  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # actionlint is not packaged by install-action, so fetch the pinned
      # release binary directly and verify its SHA-256 before trusting it.
      # Bump both the version and the checksum together (deliberately).
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "$url" -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          rm -f actionlint.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: taiki-e/install-action@873c7452cadb7c034694a1282227095d93fbdf92 # v2.79.14
        with:
          tool: zizmor

      - name: actionlint
        run: actionlint -color

      # zizmor audits workflows for injection, excessive permissions, unpinned
      # actions, etc. — the CI pipeline is itself a supply-chain surface.
      - name: zizmor
        run: zizmor .github/workflows

  # ── Supply-chain & data-protection gates ────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.9"

      # Frozen lockfile = integrity hashes are verified, no silent dep drift.
      # trustedDependencies is empty in package.json, so no install/postinstall
      # scripts run here — the primary defense against TanStack-style payloads.
      - name: Install JS deps (frozen, no scripts)
        run: bun install --frozen-lockfile

      - name: bun audit (fail on high/critical)
        run: bun audit --audit-level=high

      - name: osv-scanner (JS + Rust lockfiles)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          # The advisory ignore policy (justified unmaintained/unsound transitive
          # Tauri deps) lives in osv-scanner.toml, mirroring src-tauri/deny.toml.
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=bun.lock
            --lockfile=src-tauri/Cargo.lock

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@873c7452cadb7c034694a1282227095d93fbdf92 # v2.79.14
        with:
          tool: cargo-audit,cargo-deny

      # cargo-audit is the vulnerability gate (fails on any RustSec *vulnerability*).
      # It does not read deny.toml, so we don't pass --deny warnings here: the
      # comprehensive advisory policy — including the justified ignore list for
      # unmaintained transitive Tauri deps — lives in deny.toml and is enforced by
      # the cargo-deny step below.
      - name: cargo audit (RustSec vulnerabilities)
        working-directory: src-tauri
        run: cargo audit

      - name: cargo deny (advisories + licenses + sources + bans)
        working-directory: src-tauri
        run: cargo deny check

      # Asserts the "no outbound network" posture: our crate adds no HTTP client,
      # no network-exposing Tauri plugin is present, capabilities grant no
      # http/fs/shell access, and the CSP allows no remote origins.
      - name: No-network posture check
        run: bash scripts/check-no-network.sh

  # ── Build + typecheck matrix (the platforms we ship) ────────────────────────
  build:
    name: Build (${{ matrix.os }})
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Tauri's Linux webview/build system dependencies.
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl wget file libssl-dev libxdo-dev

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.9"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install JS deps (frozen, no scripts)
        run: bun install --frozen-lockfile

      - name: Typecheck + build frontend
        run: bun run build

      - name: Build backend (locked)
        working-directory: src-tauri
        run: cargo build --locked --verbose

      - name: Test backend (locked)
        working-directory: src-tauri
        run: cargo test --locked --verbose

  # ── SBOM for auditability ───────────────────────────────────────────────────
  sbom:
    name: SBOM (CycloneDX)
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.9"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@873c7452cadb7c034694a1282227095d93fbdf92 # v2.79.14
        with:
          tool: cargo-cyclonedx

      # cargo-cyclonedx writes the SBOM next to the manifest and --override-filename
      # is a bare basename (path separators are rejected), so it lands at
      # src-tauri/sbom-rust.json — referenced as such in the upload step below.
      - name: Rust SBOM
        working-directory: src-tauri
        run: cargo cyclonedx --format json --override-filename sbom-rust

      - name: JS SBOM
        run: bun run sbom:js

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: |
            src-tauri/sbom-rust.json
            sbom-js.json
          if-no-files-found: warn
